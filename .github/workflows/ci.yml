name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: TypeScript typecheck + unit tests ─────────────────────────────
  backend:
    name: Backend (tsc + jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_sdlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_URL_TEST: postgresql://postgres:postgres@localhost:5432/agentic_sdlc_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations (test DB)
        run: npm run migrate:up:test

      - name: Run tests with coverage
        run: npm run test:coverage

  # ─── Frontend: tsc + vitest + coverage ──────────────────────────────────────
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=verbose

  # ─── Server: tsc + jest ────────────────────────────────────────────────────
  server:
    name: Server (tsc + jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

  # ─── Shared types: tsc ───────────────────────────────────────────────────────
  shared-types:
    name: Shared types (tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: shared-types

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shared-types/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
